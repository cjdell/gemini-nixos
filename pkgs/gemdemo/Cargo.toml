# gemdemo 0.3.0 — the stripped-down Gemini PDA OpenGL template.
#
# 0.2.0 ("GEMINI: EXODUS" spacesynth demoscene, ~5200 lines over 10
# modules) was judged useless except as proof of how to talk to the
# hardware from Rust, so it was deleted down to this: ONE source file
# (src/main.rs) that opens a Wayland window with an OpenGL ES 3.1
# context (Mali-T880 / geminipda panfrost fork) and draws a spinning
# shaded triangle while an ALSA cpal stream plays a 440 Hz sine out of
# the MT6351 codec. That is the entire "hello, GPU + codec" — copy the
# file (and ../gemdemo.nix) to start a real OpenGL app. Every tricky
# bit is a hardware receipt; the comments in main.rs are the doc.
#
# Dependency policy (lockfile-pinned, small pure-Rust crates):
#   winit 0.29  wayland windowing/input (client of gemwl/labwc)
#   egl 0.2.7   EGL loader (dlopens libEGL.so.1 — glvnd client lib)
#   gl 0.14     GL bindings (load_with via eglGetProcAddress; GLES 3.1)
#   cpal 0.15   audio output — ALSA backend (the only Linux backend in
#               0.15; Pulse was removed upstream)
# libc is NOT a direct dep anymore: cpu.rs (A72 affinity) died with the
# 0.2.0 demo. See ../gemdemo.nix for the link-time story (-lEGL via
# libglvnd RUSTFLAGS, -lwayland-egl, RUNPATH pinning).

[package]
name = "gemdemo"
version = "0.3.0"
edition = "2021"
description = "gemdemo — minimal GLES 3.1 + ALSA template for the Gemini PDA (spinning triangle + 440 Hz sine)"
license = "MIT"

[dependencies]
winit = "0.29"
egl = "0.2.7"
gl = "0.14"
cpal = "0.15"

# Release opts from the demo days: "s" keeps the on-device aarch64
# build fast, no LTO (slow on the PDA). A template's hot loop is a few
# gl calls — these are about iteration speed, not performance.
[profile.release]
opt-level = "s"
strip = true
panic = "abort"
