# 60-gemini-speakers.conf — a "Built-in Speakers" virtual sink that fixes
# the L/R swap, loaded by PipeWire as a filter-chain module.
#
# WHY (reported 2026-09-10): the Gemini's two flanking speakers are wired
# LEFT<->RIGHT (the right-hand speaker plays the left channel and vice
# versa). The 3.5 mm jack is wired correctly. Both transducers ride the
# same codec HPL/HPR drivers (the speakers through external amps on SoC
# pads 243/244), so the swap is in the speaker PCB — there is no register
# to fix.
#
# Rather than swap channels for everyone, expose a second output device:
#
#   alsa_output.platform-sound.stereo-fallback   the hardware sink (jack;
#                                                channels untouched)
#   gemini_speakers                              this virtual sink: two
#                                                copy nodes cross the
#                                                pair, so the L/R-corrected
#                                                sound reaches the speakers
#
# Selecting one in GNOME Settings -> Sound (or the Quick Settings output
# picker, both list PipeWire sinks) is the "speakers vs headphones"
# switch. gemini-speakerd (services/audio.nix) follows the default sink
# and drives the speaker-amp GPIO pads accordingly: gemini_speakers ->
# amps ON, anything else -> amps OFF (jack only). The `audio-output
# speaker|headphone` CLI does the same thing from the console/panel.
#
# The hardware node keeps its ALSA/ACP-generated name (50-gemini-alsa-s16
# .conf only renames its description — WirePlumber monitor rules do not
# document renaming node.name). The name is the same stability assumption
# that file's match pattern already makes.
#
# The filter graph has no explicit links: a `copy` node passes In to Out,
# and the order of the inputs/outputs arrays performs the swap — graph
# input 0 (FL) is read from toL and written to output 1, input 1 (FR)
# from toR to output 0.
#
# The playback stream is pinned to the hardware sink with target.object,
# else WirePlumber would happily route the loopback output to the default
# sink (this very sink) and create a feedback loop. node.passive lets the
# loopback suspend together with the hardware sink when idle.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = toL label = copy }
          { type = builtin name = toR label = copy }
        ]
        inputs  = [ "toL:In" "toR:In" ]
        outputs = [ "toR:Out" "toL:Out" ]
      }
      capture.props = {
        node.name = "gemini_speakers"
        node.description = "Built-in Speakers"
        node.nick = "Speakers"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        priority.session = 100
        # Same link group as the playback side below: WirePlumber will not
        # link the loopback's output back into its own input.
        node.link-group = "gemini_speakers"
      }
      playback.props = {
        node.name = "gemini_speakers.output"
        node.description = "Built-in Speakers (post-swap feed)"
        audio.position = [ FL FR ]
        stream.dont-remix = true
        node.passive = true
        node.dont-fallback = true
        target.object = "alsa_output.platform-sound.stereo-fallback"
        node.link-group = "gemini_speakers"
      }
    }
  }
]
