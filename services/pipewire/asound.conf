# /etc/asound.conf for the Gemini PDA (2026-09-07) — see also
# build/rootfs-files/pipewire/50-gemini-alsa-s16.conf.
#
# The MT6351 analog output path (mt6797 AFE/ADDA) is 16-bit-only in
# practice: the driver advertises S16/S24/S32 but never programs a data-
# width register (mt6797-dai-adda.c hw_params sets rate only), so S24 is
# refused at hw_params and S32 plays as a square wave / white noise
# (live-verified).  S16 is clean (aplay).  This PCM pins S16_LE at the
# alsa-lib boundary: PipeWire opens it via api.alsa.path = "gemini16"
# (WirePlumber rule) and alsa-lib's plug plugin converts any incoming
# format down to real S16 before it reaches the codec.
pcm.gemini16 {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        channels 2
    }
}
