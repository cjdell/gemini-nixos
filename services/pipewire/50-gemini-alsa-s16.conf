# 50-gemini-alsa-s16.conf — force 16-bit on the MT6351 analog path.
#
# WHY (verified 2026-09-07 on hardware): the mt6797 AFE/ADDA advertises
# S16/S24/S32 but only S16 actually works.  mt6797-dai-adda.c hw_params
# sets the rate but never configures any data-width register, so >16-bit
# streams reach the DAC garbled: a direct-aplay S32 sine came out as a
# square wave and browser music (PipeWire picks S32 by default) was white
# noise; S24 is refused at hw_params; S16 aplay = clean.  The vendor
# (Android) HAL also used 16-bit.
#
# Setting node props (audio.format/format) was NOT enough: the SPA ALSA
# node enumerates formats straight from the driver and still picked S32,
# converting the DSP stream up to S32 for the codec.  The fix that works:
# open the PCM through an alsa-lib `plug` wrapper (pcm.gemini16 in
# /etc/asound.conf) that pins the SLAVE format to S16_LE — alsa-lib then
# converts anything (S24/S32/…) down to true S16 before it reaches the
# codec.  Verified: sink sample spec became s16le 48k and both S16 and
# S32 sources played as clean sine tones (user-verified).
#
# Kernel-fix queue (#329+): trim MTK_ADDA_FORMATS / MTK_PCM_FORMATS in
# sound/soc/mediatek/mt6797/ to S16_LE (or find the real data-width
# register) so native >16-bit apps are refused instead of garbled.
#
# Installed to /etc/wireplumber/wireplumber.conf.d/ by
# build/rootfs-files/pipewire/install.sh.
#
# [2026-09-10] node.description/node.nick give the hardware sink a
# user-facing name (GNOME Sound shows it as the "headphones" choice).
# Its node.name stays the ALSA/ACP-generated
# `alsa_output.platform-sound.stereo-fallback`: 60-gemini-speakers.conf
# targets that name and gemini-speakerd/audio-output use it as the
# headphones sink, the same stability assumption the match pattern below
# already makes. (We deliberately do NOT rename node.name — WirePlumber's
# monitor rules only document node.description for nodes.)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound*" }
    ]
    actions = {
      update-props = {
        api.alsa.path = "gemini16"
        audio.format = "S16_LE"
        format = "S16_LE"
        node.description = "Headphones / Jack"
        node.nick = "Headphones"
      }
    }
  }
]
