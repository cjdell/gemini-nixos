# LXQt panel config — seeded to /root/.config/lxqt/panel.conf by
# services/scripts/start-lxqt-nested (idempotent; only if absent).
#
# Shape copied from the live panel.conf lxqt-panel wrote on glass
# (2026-09-09): the running lxqt-panel stores ONE config group per
# plugin instance, group name == plugin type (no `plugins=` list under
# [panelN] on this build), so adding a group adds the plugin.
#
# [statusnotifier] (added 2026-09-09m): the StatusNotifier host the
# blueman-applet tray icon registers with (blueman 2.x uses SNI; no
# XEmbed tray exists under the wayland session). Without it
# blueman-applet runs with no visible icon.
[desktopswitch]
alignment=Left

[mount]
alignment=Right

[panel1]
alignment=-1
animation-duration=0
background-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
hidable=false
hide-on-overlap=false
iconSize=22
lineCount=1
lockPanel=false
opacity=100
panelSize=32
position=Bottom
reserve-space=true
screen-name=WL-1
show-delay=0
visible-margin=true
width=100
width-percent=true

[quicklaunch]
apps\1\desktop=/root/Desktop/google-chrome.desktop
apps\size=1

[statusnotifier]
alignment=Right

[taskbar]
alignment=Left

[volume]
alignment=Right

[worldclock]
alignment=Right
