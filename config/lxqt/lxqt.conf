# LXQt user config — seeded to $HOME/.config/lxqt/lxqt.conf by
# services/scripts/start-lxqt-nested (idempotent; only if absent).
# $HOME = /home/cjdell — the desktop runs as the cjdell user
# (2026-09-09), not root.
#
# Based on the LXQt 2.4 defaults (lxqt-session config/lxqt.conf) with the
# two device deltas:
#   - icon_theme=Papirus: the nixpkgs pin has no breeze-icons, so the
#     upstream default "breeze" would resolve to nothing and the panel
#     would log "Icon Theme not set" (blank buttons — the 2026-09-04
#     Debian receipt). Papirus (pkgs.papirus-icon-theme) is in the
#     session's XDG_DATA_DIRS. [2026-09-07]
#   - theme=Clearlooks: LXQt widget look from lxqt-themes (same theme
#     family the sibling's labwc decorations use).
# Qt font/behavior kept at the LXQt defaults.
[General]
theme=Clearlooks
icon_theme=Papirus
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon
palette_override=true

[Qt]
font="Sans,11,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
style=Fusion
wheelScrollLines=3
